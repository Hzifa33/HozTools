name: Migrate HozTools to root

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: Hzifa33/Hzifa33.github.io
          ref: main
          path: source-site

      - name: Migrate tools, languages and shared dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate_tools.py source-site --target .
          rm -rf source-site
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js

      - name: Commit migrated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync HozTools with shared design assets and languages"
          git push
